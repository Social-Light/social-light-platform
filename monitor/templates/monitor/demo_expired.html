{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Demo expired — Social Light</title>
  <link rel="icon" type="image/x-icon" href="{% static 'favicon/favicon.ico' %}?v=2">
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon/favicon.svg' %}?v=2">
  <meta name="theme-color" content="#ffffff">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;font-family:'Montserrat',system-ui,sans-serif;color:#0f172a;background:#ffffff;
      -webkit-font-smoothing:antialiased;
      display:flex;align-items:center;justify-content:center;padding:24px;
    }
    .de-card{max-width:420px;width:100%;text-align:center;}
    .de-badge{
      width:60px;height:60px;border-radius:16px;background:#fef2f2;color:#dc2626;
      display:flex;align-items:center;justify-content:center;margin:0 auto 26px;
    }
    .de-title{
      font-family:'Poppins',sans-serif;font-size:25px;font-weight:800;letter-spacing:-.02em;
      margin:0 0 12px;color:#0f172a;
    }
    .de-msg{font-size:14.5px;line-height:1.7;color:#64748b;margin:0 0 30px;}
    .de-btn{
      display:inline-block;width:100%;padding:13px 22px;border-radius:9px;font-size:14.5px;
      font-weight:700;text-decoration:none;background:#12305f;color:#fff;
      box-shadow:0 4px 16px rgba(18,48,95,.24);transition:transform .15s,background .15s;
    }
    .de-btn:hover{background:#0d2547;transform:translateY(-1px);color:#fff;}
    .de-logout{display:block;margin-top:22px;font-size:12.5px;color:#94a3b8;text-decoration:none;}
    .de-logout:hover{color:#64748b;text-decoration:underline;}
  </style>
</head>
<body>
  <div class="de-card">
    <div class="de-badge">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><path d="M12 7v6"/><path d="M12 16.5v.01"/>
      </svg>
    </div>
    <h1 class="de-title">Your demo has expired</h1>
    <p class="de-msg">
      Your {% if org %}{{ org.name }}{% endif %} trial has run its course. Add your payment
      details to keep everything exactly as it was and carry on using the full paid platform.
    </p>
    <a href="{% url 'monitor:billing' %}" class="de-btn">Add payment details</a>
    <a href="{% url 'monitor:logout' %}" class="de-logout">Log out</a>
  </div>
</body>
</html>
