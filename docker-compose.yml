version: "3.9"

services:
  # --------------------
  # Django Application
  # --------------------
  web:
    build: .
    container_name: sociallight_django
    command: gunicorn socialmonitor.wsgi:application --bind 0.0.0.0:8000 --timeout 300 --workers 3
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  # --------------------
  # PostgreSQL Database
  # --------------------
  db:
    image: postgres:15
    container_name: sociallight_db
    restart: always
    environment:
      POSTGRES_DB: sociallight
      POSTGRES_USER: sociallight
      POSTGRES_PASSWORD: sociallight_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # --------------------
  # Redis (cache / queues / scraper later)
  # --------------------
  redis:
    image: redis:7
    container_name: sociallight_redis
    restart: always
    ports:
      - "6379:6379"

  # --------------------
  # Nginx Reverse Proxy
  # --------------------
  nginx:
    image: nginx:latest
    container_name: sociallight_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - ../article-extractor/static:/app/static
    depends_on:
      - web

  extractor:
    build: /opt/sociallight/article-extractor
    container_name: sociallight_extractor
    command: gunicorn article_extractor.wsgi:application --bind 0.0.0.0:8001 
    volumes:
      - ../article-extractor:/app
      - ../article-extractor/static:/app/static 
    working_dir: /app  
    env_file:
      - .env
    depends_on:
      - db
      - redis
    expose:
      - "8001"

# --------------------
# Volumes
# --------------------
volumes:
  postgres_data:
  static_volume:
