version: "3.9"

services:
  # --------------------
  # Django Application
  # --------------------
  web:
    build: .
    container_name: sociallight_django
    restart: always
    command: gunicorn socialmonitor.wsgi:application --bind 0.0.0.0:8000 --timeout 300 --workers 3
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - POSTGRES_HOST=db
    depends_on:
      - db
      - redis
    shm_size: "1gb"
    ports:
      - "8000:8000"

  # --------------------
  # Celery worker — runs the alert-sending tasks
  # --------------------
  celery_worker:
    build: .
    container_name: sociallight_celery_worker
    restart: always
    command: celery -A socialmonitor worker -l info --concurrency 2
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - POSTGRES_HOST=db
    depends_on:
      - db
      - redis

  # --------------------
  # Celery beat — schedules the periodic alert tasks
  # --------------------
  celery_beat:
    build: .
    container_name: sociallight_celery_beat
    restart: always
    command: celery -A socialmonitor beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - POSTGRES_HOST=db
    depends_on:
      - db
      - redis

  # --------------------
  # PostgreSQL Database
  # --------------------
  db:
    image: postgres:15
    container_name: sociallight_db
    restart: always
    environment:
      POSTGRES_DB: sociallight
      POSTGRES_USER: sociallight
      POSTGRES_PASSWORD: sociallight_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # --------------------
  # Redis (cache / queues / scraper later)
  # --------------------
  redis:
    image: redis:7
    container_name: sociallight_redis
    restart: always
    ports:
      - "6379:6379"

  # --------------------
  # Nginx Reverse Proxy
  # --------------------
  nginx:
    image: nginx:latest
    container_name: sociallight_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - ../article-extractor/static:/app/static
    depends_on:
      - web

  # --------------------
  # Article Extractor
  # --------------------
  extractor:
    build: ../article-extractor
    container_name: sociallight_extractor
    restart: always
    # 2026-09-08: was a single default sync worker (no --workers/--threads at
    # all) — the whole app served one request at a time, so a slow OCR/PDF
    # extraction job blocked every other visitor's page load until it
    # finished. gthread + 2 workers/2 threads gives up to 4 concurrent
    # in-flight requests without quadrupling memory the way 4 plain sync
    # workers would (this box is 2 vCPU / ~4GB shared across the whole
    # sociallight stack) — threads specifically help the common case here,
    # which is a request blocked waiting on the (remote, cross-continental)
    # DB rather than doing real CPU work.
    command: gunicorn article_extractor.wsgi:application --bind 0.0.0.0:8001 --workers 2 --worker-class gthread --threads 2
    volumes:
      - ../article-extractor:/app
      - ../article-extractor/static:/app/static
    working_dir: /app
    # 2026-09-04: was `- .env` (this file's own directory), which meant every
    # env var this service actually reads — SITE_URL, DEFAULT_FROM_EMAIL,
    # DJANGO_SECRET_KEY, EXTRACTOR_MEDIA_ROOT — silently came from
    # social-light-platform's .env instead of the extractor's own. Some names
    # coincide (RESEND_API_KEY happened to match), but SITE_URL didn't:
    # article-extractor's own activation/reset/verification links were being
    # built against https://sociallight.africa instead of the extractor's own
    # domain. Found while wiring up EXTRACTOR_SSO_SECRET — that variable
    # exists correctly in both .env files, which is what masked this for so
    # long, but nothing else did.
    env_file:
      - ../article-extractor/.env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      - db
      - redis
    expose:
      - "8001"

  # --------------------
  # SearXNG (self-hosted metasearch — discovery/services/search_api.py's
  # "searxng" provider). Internal-only: not published to the host, reachable
  # from other services on the compose network at http://searxng:8080.
  # --------------------
  searxng:
    image: searxng/searxng:latest
    container_name: sociallight_searxng
    restart: always
    volumes:
      - ./searxng:/etc/searxng

  # --------------------
  # Media Monitor Web
  # --------------------
  crawler_web:
    build: ../media-monitor
    image: media_monitor:latest
    container_name: crawler_web
    restart: always
    command: gunicorn media_monitor.wsgi:application --bind 0.0.0.0:8002 --workers 3 --timeout 300
    volumes:
      - ../media-monitor:/app
    env_file:
      - ../media-monitor/.env
    environment:
      RUN_SETUP: "1"
    depends_on:
      - db
      - redis
      - searxng
    expose:
      - "8002"

  # --------------------
  # Media Monitor Worker
  # --------------------
  crawler_worker:
    image: media_monitor:latest
    container_name: crawler_worker
    restart: always
    command: celery -A media_monitor worker -l info --concurrency 2
    env_file:
      - ../media-monitor/.env
    environment:
      RUN_SETUP: "0"
    depends_on:
      - crawler_web
      - db
      - redis
      - searxng

  # --------------------
  # Media Monitor Beat
  # --------------------
  crawler_beat:
    image: media_monitor:latest
    container_name: crawler_beat
    restart: always
    command: celery -A media_monitor beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ../media-monitor/.env
    environment:
      RUN_SETUP: "0"
    depends_on:
      - crawler_web
      - db
      - redis
      - searxng

# --------------------
# Volumes
# --------------------
volumes:
  postgres_data:
  static_volume:
