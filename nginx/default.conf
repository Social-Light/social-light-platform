server {
    listen 80;
    client_max_body_size 50M;  

    location /static/ {
    alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Allow long-running requests (e.g. AI report generation) to complete.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    client_max_body_size 50M;
    server_name extractor.sociallight.africa;
    location /static/ {
     alias /app/static/;      # 👈 changed from /app/staticfiles/
   }
 
    location / {
        proxy_pass http://extractor:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    client_max_body_size 10M;
    server_name potso.sociallight.africa;

    # POTSO's own nginx container (potso_nginx) runs with --network host and
    # listens on the host's :8090, so it's reached via this network's docker
    # bridge gateway rather than a service name in this compose file - POTSO
    # is a separate app, not part of this docker-compose stack.
    location / {
        proxy_pass http://172.18.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare terminates TLS for *.sociallight.africa and reaches this
        # origin over plain HTTP, so every request arriving here started as
        # HTTPS at the browser. Django reads this via SECURE_PROXY_SSL_HEADER.
        proxy_set_header X-Forwarded-Proto https;
    }
}

